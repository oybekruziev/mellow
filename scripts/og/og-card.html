<!doctype html>
<!-- Source for website/og-image.jpg (1200×630). Render with: zsh scripts/og/render.sh -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../website/styles.css">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    .card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
    .card > .wallpaper { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(251, 250, 247, .97) 0%, rgba(251, 250, 247, .93) 44%, rgba(251, 250, 247, 0) 70%);
    }
    .copy { position: absolute; left: 80px; top: 0; bottom: 0; width: 560px; z-index: 1; display: flex; flex-direction: column; justify-content: center; }
    .copy .brand img { width: 52px; height: 52px; }
    .copy .brand span { font-size: 34px; }
    .copy h1 {
      margin-top: 36px;
      font-family: var(--font-rounded);
      font-weight: 600;
      font-size: 68px;
      line-height: 1.05;
      letter-spacing: -0.025em;
      text-wrap: balance;
    }
    .copy p { margin-top: 20px; font-size: 26px; line-height: 36px; color: var(--label-2); }
    .copy .url { margin-top: 40px; font-size: 22px; font-weight: 590; color: var(--tint-focus); }
    .card .panel { position: absolute; z-index: 1; right: 84px; top: 50%; transform: translateY(-50%); --z: 1.32; }
  </style>
</head>
<body>
  <div class="card">
    <img class="wallpaper" src="../../website/assets/wallpaper-light.jpg" alt="">
    <div class="copy">
      <div class="brand"><img src="../../website/assets/logo.png" alt=""><span>Mellow</span></div>
      <h1>A little space to focus.</h1>
      <p>One task, one timer, one small flower. A calm focus timer for macOS 26.</p>
      <span class="url">bemellow.cc</span>
    </div>
    <div class="panel">
      <div class="p-head">
        <div class="p-avatar"><img src="../../website/assets/companion-sprout.png" alt=""></div>
        <div class="p-task">
          <span class="p-title">Finish the article</span>
          <span class="p-status"><img class="dot" src="../../website/assets/state-dot.svg" alt="">Focusing · 25 min</span>
        </div>
        <div class="p-tools"><span><img src="../../website/assets/icon-settings.svg" alt=""></span><span><img src="../../website/assets/icon-compact.svg" alt=""></span><span><img src="../../website/assets/icon-hide.svg" alt=""></span></div>
      </div>
      <div class="p-timer">
        <span class="p-time">24:38</span>
        <span class="grow"></span>
        <span class="p-end glass-btn"><img src="../../website/assets/icon-stop.svg" alt=""></span>
        <span class="p-pause tinted"><img src="../../website/assets/icon-pause.svg" alt=""></span>
      </div>
      <div class="p-progress"><i></i></div>
      <div class="p-today">
        <span class="p-flowers"><img src="../../website/assets/flower.png" alt=""><img src="../../website/assets/flower.png" alt=""><img src="../../website/assets/flower.png" alt=""></span>
        <span>3 sessions today</span>
      </div>
    </div>
  </div>
</body>
</html>
